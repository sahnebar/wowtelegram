name: Desktop checks and test builds

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run check
      - run: npm test
      - run: npm run test:ui
      - run: npm run pack
      - run: node tests/packaged.cjs
      - if: runner.os == 'macOS'
        run: npm run build:mac
      - if: runner.os == 'Windows'
        run: npm run build:win -- --config.win.signExecutable=false
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: desktop-${{ runner.os }}
          retention-days: 7
          path: |
            test-results/
            release/*/*.dmg
            release/*/*.zip
            release/*/*.exe

  release:
    needs: desktop
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'sahnebar/wowtelegram'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Download the tested installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run download "$GITHUB_RUN_ID" --pattern 'desktop-*' --dir artifacts
      - name: Prepare release assets and checksums
        run: python3 scripts/prepare-release.py --artifact-root artifacts --output public-release
      - name: Publish the test release once
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; keeping its files unchanged."
          else
            gh release create "v$VERSION" public-release/* \
              --target "$GITHUB_SHA" \
              --title "Azeroth Relay $VERSION · Testversion" \
              --notes-file RELEASE_NOTES.md \
              --prerelease
          fi
